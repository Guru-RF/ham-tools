# Build the Arch package for a tag and publish it to repo.rf.guru.
#
# On a v* tag the package is built from packaging/aur/ham-tools with makepkg,
# attached to the tag's GitHub release, and uploaded to the repo server, which
# signs the package and the database itself and publishes them into the Arch
# repository "guru". See Guru-RF/arch-repo.
#
# Unlike SVXConnect-Omarchy this is driven by the tag rather than by the
# published release, because windows.yml creates that release itself as soon
# as its own build finishes — waiting for it would be a race.
#
# To publish an existing tag by hand:
#   gh workflow run publish-repo.yml -R Guru-RF/ham-tools -f tag=v0.2.3
name: publish-repo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true

permissions:
  contents: write   # the package is attached to the tag's release

# One publish at a time, so two tags cannot interleave their uploads.
concurrency:
  group: publish-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Install packaging tools and build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
              git github-cli pacman-contrib rsync openssh \
              curl libyaml jansson libxml2 sqlite readline ncurses libwebsockets

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # makepkg refuses to run as root, which is what the container is.
          useradd -m build
          install -d -o build /work
          install -o build -m 644 packaging/aur/ham-tools/PKGBUILD /work/PKGBUILD
          cd /work

          # The committed PKGBUILD tracks the last release; point it at the tag
          # being built and take the checksum from the tarball GitHub now
          # serves for it. Both run as the build user, which owns the PKGBUILD.
          sudo -u build sed -i "s/^pkgver=.*/pkgver=${TAG#v}/" PKGBUILD
          sudo -u build updpkgsums
          # No --nodeps: makepkg checking its own depends list against what we
          # installed above is the test that the list is complete.
          sudo -u build makepkg --noconfirm
          # Arch builds a separate -debug package by default; the repo does not
          # carry those, so it never leaves this runner.
          rm -f /work/*-debug-*.pkg.tar.zst
          ls -l /work/*.pkg.tar.zst

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # windows.yml creates this release from the same tag, whichever of us
          # gets there first; --clobber lets us re-run over our own upload.
          gh release view "$TAG" >/dev/null 2>&1 ||
              gh release create "$TAG" --title "$TAG" --generate-notes ||
              gh release view "$TAG" >/dev/null
          gh release upload "$TAG" /work/*.pkg.tar.zst --clobber

      - name: Upload and publish to repo.rf.guru
        env:
          # The private half of arch-repo/keys/github-actions.pub. The server
          # locks that key to upload / publish / list / remove.
          REPO_UPLOAD_KEY: ${{ secrets.REPO_UPLOAD_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$REPO_UPLOAD_KEY" ]; then
            echo "::error::secret REPO_UPLOAD_KEY is not set"
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$REPO_UPLOAD_KEY" > "$HOME/.ssh/repo-upload"
          chmod 600 "$HOME/.ssh/repo-upload"

          # Pinned, so a runner never trusts whatever answers on first contact.
          # Update these if the VM is ever recreated with new host keys.
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          repo.rf.guru ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINTlW5a+KMN4gSBOc5yMOMNdPLi/PmtL+Uz6uuCiAFws
          repo.rf.guru ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBNPOTtix7w4SDDnXqQWTNsgwd6YUnPCZxt0BCNlxJk14Cy14tELTmjhZaM/8l+MbIfpT/wjaECF8IO/YARkABFI=
          repo.rf.guru ssh-rsa 
          EOF
          sed -i 's/^ *//' "$HOME/.ssh/known_hosts"

          # Same steps as arch-repo's bin/repo-upload: rsync into a unique batch,
          # then publish it, over one shared SSH connection.
          target=repo@repo.rf.guru
          batch="$(date +%Y%m%d%H%M%S)-gha-$GITHUB_RUN_ID"
          ssh_opts=(-i "$HOME/.ssh/repo-upload" -o IdentitiesOnly=yes -o BatchMode=yes
                    -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
                    -o ControlMaster=auto -o ControlPath="$HOME/.ssh/cm-%C" -o ControlPersist=60)
          trap 'ssh "${ssh_opts[@]}" -O exit "$target" 2>/dev/null || true' EXIT

          rsync --times --chmod=F644 -e "ssh ${ssh_opts[*]}" -- /work/*.pkg.tar.zst "$target:arch/$batch/"
          ssh "${ssh_opts[@]}" "$target" publish arch guru "$batch"
